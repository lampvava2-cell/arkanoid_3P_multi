<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3인 멀티 알카노이드 (공 렌더링 수정)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0b0c12;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #versionTitle {
      font-size: 13px;
      color: #00ffcc;
      font-weight: bold;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    #netStatus {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #2a2010;
      color: #ffaa00;
      margin-bottom: 6px;
      font-weight: bold;
    }
    #scoreboard {
      display: flex;
      justify-content: space-around;
      width: min(92vw, 480px);
      background: #181b29;
      border: 1px solid #334;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: bold;
    }
    .score-item { display: flex; gap: 6px; }
    .score-item.bottom { color: #00ffcc; }
    .score-item.left { color: #ff007f; }
    .score-item.right { color: #ffaa00; }

    #chargeContainer {
      width: min(92vw, 480px);
      height: 14px;
      background: #10121d;
      border: 1px solid #ff00ea;
      border-radius: 10px;
      margin-bottom: 6px;
      overflow: hidden;
      position: relative;
      display: none;
      box-shadow: 0 0 10px rgba(255, 0, 234, 0.4);
    }
    #chargeBar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff00ea, #ffcc00);
      box-shadow: 0 0 12px #ffcc00;
      transition: width 0.04s linear;
    }
    #chargeText {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 3px #000;
      letter-spacing: 0.5px;
    }

    #waitingNoticeBanner {
      display: none;
      background: rgba(255, 170, 0, 0.25);
      border: 1px solid #ffaa00;
      color: #ffcc00;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; transform: scale(1.02); }
    }

    #container {
      position: relative;
      width: min(92vw, 480px);
      height: min(92vw, 480px);
      aspect-ratio: 1 / 1;
      border: 2px solid #334;
      box-shadow: 0 0 25px rgba(0,255,255,0.18);
      background: #141622;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      aspect-ratio: 1 / 1;
    }
    
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 12, 18, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 14px;
    }
    h2 { margin: 0 0 8px 0; color: #fff; font-size: 17px; }
    
    .name-box {
      display: flex;
      gap: 6px;
      width: 88%;
      margin-bottom: 8px;
    }
    .name-box input {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #445;
      background: #1d2030;
      color: #fff;
      font-size: 13px;
      text-align: center;
    }
    .name-box button {
      padding: 0 14px;
      background: #3a7bd5;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      font-size: 12px;
    }

    .sliders-panel {
      width: 88%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    .speed-control-box {
      background: #1a1d2e;
      border: 1px solid #334;
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .speed-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #aaa;
    }
    .speed-labels span strong {
      font-size: 13px;
    }
    .speed-slider {
      width: 100%;
      cursor: pointer;
    }
    #speedSlider { accent-color: #00ffcc; }
    #orbSpeedSlider { accent-color: #ff00ea; }
    
    .role-grid { display: flex; flex-direction: column; gap: 6px; width: 88%; margin-bottom: 10px; }
    .role-btn {
      padding: 9px 12px;
      border: 2px solid #3e445b;
      background: #1d2030;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      outline: none;
    }
    .role-btn.active { border-color: #00ffcc; background: #0f3636; color: #00ffcc; }
    #startBtn {
      width: 88%;
      padding: 11px;
      background: #00d2ff;
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    #stageBadge {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 12px;
      color: #ffaa00;
      font-weight: bold;
      display: none;
      z-index: 5;
    }
    #waitingOverlay { display: none; }
    .waiting-spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(0, 255, 204, 0.2);
      border-top-color: #00ffcc;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 16px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    #countdownOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #countdownText {
      font-size: 58px;
      font-weight: 900;
      color: #00ffcc;
      text-shadow: 0 0 20px #00ffcc;
    }
    #countdownSub {
      font-size: 14px;
      color: #fff;
      margin-top: 6px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="versionTitle">정통알카노이드 (공 렌더링 수정)</div>
  <div id="netStatus">🟡 Railway 서버 신호 연결 중...</div>

  <div id="scoreboard">
    <div class="score-item left" id="score-left">L(좌): 0</div>
    <div class="score-item bottom" id="score-bottom">B(하): 0</div>
    <div class="score-item right" id="score-right">R(우): 0</div>
  </div>

  <div id="chargeContainer">
    <div id="chargeBar"></div>
    <div id="chargeText">ORB CHARGING 0%</div>
  </div>

  <div id="waitingNoticeBanner">🔔 대기실에 참가자가 있습니다!</div>
  
  <div id="container">
    <div id="stageBadge">STAGE 1 / 3</div>
    <canvas id="game" width="500" height="500"></canvas>

    <div id="countdownOverlay" style="display: none;">
      <div id="countdownText">2</div>
      <div id="countdownSub">준비하세요!</div>
    </div>

    <div id="lobbyOverlay" class="overlay">
      <h2>포지션 선택 및 세팅</h2>
      <div class="name-box">
        <input type="text" id="nameInput" placeholder="닉네임 입력 (최대 6자)" maxlength="6">
        <button type="button" onclick="changeName()">확인</button>
      </div>

      <!-- 기본 디폴트 4단계로 설정된 슬라이더 -->
      <div class="sliders-panel">
        <div class="speed-control-box">
          <div class="speed-labels">
            <span>공 속도 설정</span>
            <span><strong id="speedValue" style="color:#00ffcc;">4</strong> 단계 (1~10)</span>
          </div>
          <input type="range" min="1" max="10" value="4" id="speedSlider" class="speed-slider" oninput="changeSpeed(this.value)">
        </div>

        <div class="speed-control-box">
          <div class="speed-labels">
            <span>마법구슬 회전 속도</span>
            <span><strong id="orbSpeedValue" style="color:#ff00ea;">4</strong> 단계 (1~10)</span>
          </div>
          <input type="range" min="1" max="10" value="4" id="orbSpeedSlider" class="speed-slider" oninput="changeOrbSpeed(this.value)">
        </div>
      </div>

      <div class="role-grid">
        <button type="button" class="role-btn" id="btn-bottom" onclick="selectRole('bottom')">
          <span>하단 (가로)</span> <span id="label-bottom">BOT</span>
        </button>
        <button type="button" class="role-btn" id="btn-left" onclick="selectRole('left')">
          <span>좌측 (세로)</span> <span id="label-left">BOT</span>
        </button>
        <button type="button" class="role-btn" id="btn-right" onclick="selectRole('right')">
          <span>우측 (세로)</span> <span id="label-right">BOT</span>
        </button>
      </div>
      <button type="button" id="startBtn" onclick="requestStart()">GAME START</button>
    </div>

    <div id="waitingOverlay" class="overlay">
      <div class="waiting-spinner"></div>
      <h2 style="color:#ffcc00; margin-bottom:8px;">자리가 꽉 차있습니다</h2>
      <p style="font-size:13px; color:#aaa; text-align:center; line-height:1.5; margin:0 0 16px 0;">
        현재 3명의 플레이어가 대결 중입니다.<br>
        <strong>[대기실]</strong>에서 관전하며 대기해 주세요.<br>
        빈 자리가 생기면 즉시 난입 가능합니다!
      </p>
      <div class="name-box" style="width:75%;">
        <input type="text" id="waitingNameInput" placeholder="내 닉네임 설정" maxlength="6">
        <button type="button" onclick="changeWaitingName()">등록</button>
      </div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function playSynthSound(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === "paddle") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(540, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } 
      else if (type === "brick") {
        osc.type = "square";
        osc.frequency.setValueAtTime(680, now);
        osc.frequency.exponentialRampToValueAtTime(980, now + 0.09);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.09);
        osc.start(now);
        osc.stop(now + 0.09);
      }
      else if (type === "iron_hit") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      }
      else if (type === "hard_hit") {
        osc.type = "square";
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.07);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.07);
        osc.start(now);
        osc.stop(now + 0.07);
      }
      else if (type === "powerup") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(523, now);
        osc.frequency.setValueAtTime(659, now + 0.08);
        osc.frequency.setValueAtTime(784, now + 0.16);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
        osc.start(now);
        osc.stop(now + 0.28);
      }
      else if (type === "restore") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(330, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      else if (type === "catch") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      }
      else if (type === "orb") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(950, now);
        osc.frequency.exponentialRampToValueAtTime(250, now + 0.22);
        gain.gain.setValueAtTime(0.26, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      } 
      else if (type === "lose") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      else if (type === "wall") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    }

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const versionTitle = document.getElementById("versionTitle");
    const netStatus = document.getElementById("netStatus");
    const lobbyOverlay = document.getElementById("lobbyOverlay");
    const waitingOverlay = document.getElementById("waitingOverlay");
    const waitingNoticeBanner = document.getElementById("waitingNoticeBanner");
    const countdownOverlay = document.getElementById("countdownOverlay");
    const countdownText = document.getElementById("countdownText");
    const countdownSub = document.getElementById("countdownSub");
    const stageBadge = document.getElementById("stageBadge");
    const nameInput = document.getElementById("nameInput");
    const waitingNameInput = document.getElementById("waitingNameInput");

    const speedSlider = document.getElementById("speedSlider");
    const speedValue = document.getElementById("speedValue");
    const orbSpeedSlider = document.getElementById("orbSpeedSlider");
    const orbSpeedValue = document.getElementById("orbSpeedValue");

    const chargeContainer = document.getElementById("chargeContainer");
    const chargeBar = document.getElementById("chargeBar");
    const chargeText = document.getElementById("chargeText");

    const scoreLeft = document.getElementById("score-left");
    const scoreBottom = document.getElementById("score-bottom");
    const scoreRight = document.getElementById("score-right");

    const WS_URL = "wss://arkanoid3pmulti-production.up.railway.app";
    let ws = null;
    let myRole = "bottom";
    let myName = "플레이어" + Math.floor(Math.random() * 900 + 100);
    nameInput.value = myName;

    let activeBricks = [];
    let balls = [];
    let ballTrails = [];
    let orbData = null;
    let paddles = { bottom: 250, left: 250, right: 250 };
    let playerNames = { bottom: "BOT", left: "BOT", right: "BOT" };
    let botSlots = ["bottom", "left", "right"];
    let powerupStatus = {
      bottom: { type: null, remain: 0 },
      left: { type: null, remain: 0 },
      right: { type: null, remain: 0 }
    };
    let ballStuckTo = null;

    let lastTouchX = null;
    let lastTouchY = null;
    let touchMoved = false;

    function updateScoreboard(scores, names) {
      scoreBottom.innerText = `${names.bottom}: ${scores.bottom}`;
      scoreLeft.innerText = `${names.left}: ${scores.left}`;
      scoreRight.innerText = `${names.right}: ${scores.right}`;
    }

    function changeSpeed(val) {
      speedValue.innerText = val;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "set_speed", level: parseInt(val) }));
      }
    }

    function changeOrbSpeed(val) {
      orbSpeedValue.innerText = val;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "set_orb_speed", level: parseInt(val) }));
      }
    }

    function connectSocket() {
      netStatus.innerText = "🟡 Railway 연결 시도 중...";
      netStatus.style.background = "#2a2010";
      netStatus.style.color = "#ffaa00";

      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        netStatus.innerText = "🟢 Railway 온라인 연결 완료";
        netStatus.style.background = "#0f3636";
        netStatus.style.color = "#00ffcc";

        ws.send(JSON.stringify({ type: "set_name", name: myName }));
        ws.send(JSON.stringify({ type: "select_role", role: myRole }));
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === "lobby_state") {
          versionTitle.innerText = `[ ${msg.title} ]`;
          updateLobbyUI(msg.slots);
          if (msg.scores) updateScoreboard(msg.scores, playerNames);
          if (msg.speed_level !== undefined) {
            speedSlider.value = msg.speed_level;
            speedValue.innerText = msg.speed_level;
          }
          if (msg.orb_speed_level !== undefined) {
            orbSpeedSlider.value = msg.orb_speed_level;
            orbSpeedValue.innerText = msg.orb_speed_level;
          }

          if (msg.waiting_users && msg.waiting_users.length > 0 && myRole) {
            waitingNoticeBanner.style.display = "block";
            waitingNoticeBanner.innerText = `🔔 '${msg.waiting_users.join(", ")}' 님이 대기실 대기 중!`;
          } else {
            waitingNoticeBanner.style.display = "none";
          }
        } 
        else if (msg.type === "waiting_room_notice") {
          lobbyOverlay.style.display = "none";
          waitingOverlay.style.display = "flex";
          stageBadge.style.display = "block";
          stageBadge.innerText = `STAGE ${msg.stage} / 3 (관전 중)`;
        } 
        else if (msg.type === "game_start") {
          if (msg.assigned_role) {
            myRole = msg.assigned_role;
          }
          lobbyOverlay.style.display = "none";
          waitingOverlay.style.display = "none";
          stageBadge.style.display = "block";
        } 
        else if (msg.type === "game_update") {
          balls = msg.balls || [];
          orbData = msg.orb;
          ballStuckTo = msg.ball_stuck_to;
          powerupStatus = msg.powerup_status || powerupStatus;

          for (let r of ["bottom", "left", "right"]) {
            if (r !== myRole) {
              paddles[r] = msg.paddles[r];
            }
          }
          playerNames = msg.names || playerNames;
          botSlots = msg.bot_slots || [];
          stageBadge.innerText = `STAGE ${msg.stage} / 3`;

          if (msg.active_bricks) {
            activeBricks = msg.active_bricks;
          }

          if (msg.scores) updateScoreboard(msg.scores, playerNames);

          if (orbData && orbData.holding) {
            chargeContainer.style.display = "block";
            const pct = Math.round(orbData.progress * 100);
            chargeBar.style.width = `${pct}%`;
            chargeText.innerText = `ORB CHARGING ${pct}% (부활 블록 20% 복원!)`;
          } else {
            chargeContainer.style.display = "none";
            chargeBar.style.width = "0%";
          }

          if (msg.pause_sec && msg.pause_sec > 0.05) {
            countdownOverlay.style.display = "flex";
            countdownText.innerText = Math.ceil(msg.pause_sec);
          } else {
            countdownOverlay.style.display = "none";
          }

          if (msg.sound) {
            playSynthSound(msg.sound);
          }

          render();
        }
      };

      ws.onclose = () => {
        netStatus.innerText = "🔴 연결 종료 (재접속 대기 중)";
        netStatus.style.background = "#3a1010";
        netStatus.style.color = "#ff4444";
        setTimeout(connectSocket, 2000);
      };
    }

    connectSocket();

    function changeName() {
      initAudio();
      if (!nameInput.value.trim()) return;
      myName = nameInput.value.trim();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "set_name", name: myName }));
      }
    }

    function changeWaitingName() {
      initAudio();
      if (!waitingNameInput.value.trim()) return;
      myName = waitingNameInput.value.trim();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "set_name", name: myName }));
      }
    }

    function selectRole(role) {
      initAudio();
      myRole = role;
      changeName();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "select_role", role: role }));
      }
    }

    function requestStart() {
      initAudio();
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert("서버 연결 중입니다. 초록불이 들어온 후 눌러주세요.");
        return;
      }
      changeName();
      ws.send(JSON.stringify({ type: "select_role", role: myRole }));
      setTimeout(() => {
        ws.send(JSON.stringify({ type: "start_game" }));
      }, 50);
    }

    function updateLobbyUI(slots) {
      ["bottom", "left", "right"].forEach(r => {
        const btn = document.getElementById(`btn-${r}`);
        const label = document.getElementById(`label-${r}`);
        const slotData = slots[r];
        
        btn.classList.toggle("active", myRole === r);
        if (slotData.type === "USER") {
          label.innerText = (myRole === r ? "[나] " : "") + slotData.name;
          label.style.color = "#00ffcc";
        } else {
          label.innerText = "BOT (컴퓨터)";
          label.style.color = "#888";
        }
      });
    }

    canvas.addEventListener("touchstart", (e) => {
      initAudio();
      touchMoved = false;
      const touch = e.touches[0];
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;

      if (ballStuckTo === myRole && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "release_ball" }));
      }
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      touchMoved = true;
      if (!myRole || !ws || ws.readyState !== WebSocket.OPEN || lastTouchX === null) return;

      const touch = e.touches[0];
      const deltaX = touch.clientX - lastTouchX;
      const deltaY = touch.clientY - lastTouchY;
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;

      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;

      if (myRole === "bottom") {
        paddles.bottom = Math.max(35, Math.min(465, paddles.bottom + deltaX * scale * 1.3));
        ws.send(JSON.stringify({ type: "move", pos: paddles.bottom }));
      } else if (myRole === "left") {
        paddles.left = Math.max(35, Math.min(465, paddles.left + deltaY * scale * 1.3));
        ws.send(JSON.stringify({ type: "move", pos: paddles.left }));
      } else if (myRole === "right") {
        paddles.right = Math.max(35, Math.min(465, paddles.right + deltaY * scale * 1.3));
        ws.send(JSON.stringify({ type: "move", pos: paddles.right }));
      }
    }, { passive: false });

    canvas.addEventListener("touchend", () => {
      if (!touchMoved && ballStuckTo === myRole && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "release_ball" }));
      }
      lastTouchX = null;
      lastTouchY = null;
    });

    function drawCurvedPaddle(x, y, w, h, color, labelText, powerup) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.beginPath();
      const r = Math.min(w, h) / 2;
      ctx.roundRect(x, y, w, h, r);

      if (powerup && powerup.type) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 18;
      }
      ctx.fill();
      ctx.closePath();
      ctx.restore();

      ctx.fillStyle = "#fff";
      ctx.font = "bold 10px sans-serif";

      let displayStr = labelText;
      if (powerup && powerup.type && powerup.remain > 0) {
        const sec = Math.ceil(powerup.remain);
        if (powerup.type === "CATCH") displayStr += ` 🧲[${sec}s]`;
        else if (powerup.type === "MULTI") displayStr += ` 🔮[${sec}s]`;
        else if (powerup.type === "IRON") displayStr += ` 💣[${sec}s]`;
      }

      if (w > h) {
        ctx.textAlign = "center";
        ctx.fillText(displayStr, x + w / 2, y - 6);
      } else {
        ctx.textAlign = x < 50 ? "left" : "right";
        ctx.fillText(displayStr, x < 50 ? x + 16 : x - 6, y + h / 2 + 4);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#333";
      ctx.fillRect(0, 0, canvas.width, 10);

      if (orbData) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(orbData.rail_cx, orbData.rail_cy, orbData.rail_r, 0, Math.PI * 2);
        ctx.strokeStyle = orbData.holding ? "rgba(255, 0, 234, 0.45)" : "rgba(0, 255, 204, 0.22)";
        ctx.lineWidth = orbData.holding ? 3 : 2;
        ctx.setLineDash([8, 8]);
        ctx.stroke();
        ctx.closePath();

        const orbR = orbData.radius || 9;
        ctx.beginPath();
        ctx.arc(orbData.x, orbData.y, orbR, 0, Math.PI * 2);
        ctx.fillStyle = orbData.holding ? "#ffcc00" : "#ff00ea";
        ctx.shadowColor = orbData.holding ? "#ffcc00" : "#ff00ea";
        ctx.shadowBlur = orbData.holding ? 22 : 14;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.closePath();

        ctx.beginPath();
        ctx.arc(orbData.x, orbData.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.closePath();
        ctx.restore();
      }

      activeBricks.forEach(b => {
        ctx.save();
        if (b.hardened) {
          if (b.hp === 2) {
            ctx.fillStyle = "#d4af37";
            ctx.strokeStyle = "#fff275";
            ctx.lineWidth = 1.5;
            ctx.shadowColor = "#ffd700";
            ctx.shadowBlur = 8;
          } else {
            ctx.fillStyle = "#b84200";
            ctx.strokeStyle = "#ff7733";
            ctx.lineWidth = 1;
          }
        } else {
          ctx.fillStyle = "#2c5282";
          ctx.strokeStyle = "#4299e1";
          ctx.lineWidth = 1;
        }

        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeRect(b.x, b.y, b.w, b.h);

        if (b.hardened && b.hp === 2) {
          ctx.fillStyle = "#fff";
          ctx.font = "bold 9px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("★", b.x + b.w / 2, b.y + b.h - 3);
        }
        ctx.restore();
      });

      const getPaddleColor = (role, isBot) => {
        const p = powerupStatus[role];
        if (p && p.type && p.remain > 0) {
          if (p.type === "CATCH") return "#ffd700";
          if (p.type === "MULTI") return "#00ffcc";
          if (p.type === "IRON") return "#a855f7";
        }
        if (isBot) return "#555";
        if (role === "bottom") return "#00ffcc";
        if (role === "left") return "#ff007f";
        return "#ffaa00";
      };

      const isBotBottom = botSlots.includes("bottom");
      drawCurvedPaddle(paddles.bottom - 35, canvas.height - 20, 70, 10, getPaddleColor("bottom", isBotBottom), playerNames.bottom, powerupStatus.bottom);

      const isBotLeft = botSlots.includes("left");
      drawCurvedPaddle(10, paddles.left - 35, 10, 70, getPaddleColor("left", isBotLeft), playerNames.left, powerupStatus.left);

      const isBotRight = botSlots.includes("right");
      drawCurvedPaddle(canvas.width - 20, paddles.right - 35, 10, 70, getPaddleColor("right", isBotRight), playerNames.right, powerupStatus.right);

      balls.forEach((ball) => {
        if (ball.is_iron) {
          ballTrails.push({ x: ball.x, y: ball.y, alpha: 0.65 });
        }
      });

      for (let i = ballTrails.length - 1; i >= 0; i--) {
        const t = ballTrails[i];
        ctx.beginPath();
        ctx.arc(t.x, t.y, 7, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(168, 85, 247, ${t.alpha * 0.4})`;
        ctx.shadowColor = "#a855f7";
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.closePath();
        t.alpha -= 0.08;
        if (t.alpha <= 0) {
          ballTrails.splice(i, 1);
        }
      }

      // 공 렌더링 검증 및 강제 보정 출력
      balls.forEach((ball, idx) => {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius || 8, 0, Math.PI * 2);

        if (ball.is_iron) {
          const ironGrad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, ball.radius || 8);
          ironGrad.addColorStop(0, "#ffffff");
          ironGrad.addColorStop(0.25, "#888888");
          ironGrad.addColorStop(0.75, "#18181b");
          ironGrad.addColorStop(1, "#050505");
          ctx.fillStyle = ironGrad;
          ctx.shadowColor = "#c084fc";
          ctx.shadowBlur = 14;
        } else if (ballStuckTo && idx === 0) {
          ctx.fillStyle = "#ffea00";
          ctx.shadowColor = "#ffaa00";
          ctx.shadowBlur = 18;
        } else if (orbData && orbData.holding && idx === 0) {
          ctx.fillStyle = "#ffff55";
          ctx.shadowColor = "#ffea00";
          ctx.shadowBlur = 12;
        } else {
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "#00d2ff";
          ctx.shadowBlur = 10;
        }

        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.closePath();
      });
    }
  </script>
</body>
