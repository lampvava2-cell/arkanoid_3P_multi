<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3인멀티알카노이드(정사각형 & 대기실)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0b0c12;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #versionTitle {
      font-size: 13px;
      color: #00ffcc;
      font-weight: bold;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    /* 대기실 접속자 알림 배너 (플레이어 화면용) */
    #waitingNoticeBanner {
      display: none;
      background: rgba(255, 170, 0, 0.25);
      border: 1px solid #ffaa00;
      color: #ffcc00;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; transform: scale(1.02); }
    }
    /* [핵심] 완전 1:1 정사각형 캔버스 컨테이너 */
    #container {
      position: relative;
      width: min(92vw, 480px);
      height: min(92vw, 480px);
      aspect-ratio: 1 / 1;
      border: 2px solid #334;
      box-shadow: 0 0 25px rgba(0,255,255,0.18);
      background: #141622;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      aspect-ratio: 1 / 1;
    }
    
    /* 로비 & 대기실 오버레이 공통 */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 12, 18, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 16px;
    }
    h2 { margin: 0 0 12px 0; color: #fff; font-size: 18px; }
    
    /* 닉네임 입력 */
    .name-box {
      display: flex;
      gap: 6px;
      width: 86%;
      margin-bottom: 12px;
    }
    .name-box input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #445;
      background: #1d2030;
      color: #fff;
      font-size: 13px;
      text-align: center;
    }
    .name-box button {
      padding: 0 14px;
      background: #3a7bd5;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      font-size: 12px;
    }
    
    .role-grid { display: flex; flex-direction: column; gap: 8px; width: 86%; margin-bottom: 14px; }
    .role-btn {
      padding: 11px 14px;
      border: 2px solid #3e445b;
      background: #1d2030;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      outline: none;
    }
    .role-btn.active { border-color: #00ffcc; background: #0f3636; color: #00ffcc; }
    #startBtn {
      width: 86%;
      padding: 13px;
      background: #00d2ff;
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #stageBadge {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 12px;
      color: #ffaa00;
      font-weight: bold;
      display: none;
      z-index: 5;
    }
    
    /* 3번째 대기자 전용 화면 */
    #waitingOverlay {
      display: none;
    }
    .waiting-spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(0, 255, 204, 0.2);
      border-top-color: #00ffcc;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 16px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="versionTitle">정밀물리엔진버전7 (True Square & Waiting Room)</div>
  <div id="waitingNoticeBanner">🔔 대기실에 참가자가 있습니다!</div>
  
  <div id="container">
    <div id="stageBadge">STAGE 1 / 3</div>
    <canvas id="game" width="500" height="500"></canvas>

    <!-- 1. 기본 로비 (자리 선택) -->
    <div id="lobbyOverlay" class="overlay">
      <h2>3인 알카노이드 로비</h2>
      <div class="name-box">
        <input type="text" id="nameInput" placeholder="닉네임 입력 (최대 6자)" maxlength="6">
        <button onclick="changeName()">확인</button>
      </div>
      <div class="role-grid">
        <button class="role-btn" id="btn-bottom" onclick="selectRole('bottom')">
          <span>하단 (가로)</span> <span id="label-bottom">BOT</span>
        </button>
        <button class="role-btn" id="btn-left" onclick="selectRole('left')">
          <span>좌측 (세로)</span> <span id="label-left">BOT</span>
        </button>
        <button class="role-btn" id="btn-right" onclick="selectRole('right')">
          <span>우측 (세로)</span> <span id="label-right">BOT</span>
        </button>
      </div>
      <button id="startBtn" onclick="requestStart()">GAME START</button>
    </div>

    <!-- 2. 난입자 대기실 화면 (3번째 접속자) -->
    <div id="waitingOverlay" class="overlay">
      <div class="waiting-spinner"></div>
      <h2 style="color:#ffcc00; margin-bottom:8px;">게임이 이미 진행 중입니다</h2>
      <p style="font-size:13px; color:#aaa; text-align:center; line-height:1.5; margin:0 0 16px 0;">
        현재 2명의 플레이어가 대결 중입니다.<br>
        <strong>[대기실]</strong>에서 잠시 관전하며 대기해 주세요.<br>
        다음 게임 시작 시 바로 참여 가능합니다!
      </p>
      <div class="name-box" style="width:75%;">
        <input type="text" id="waitingNameInput" placeholder="내 닉네임 설정" maxlength="6">
        <button onclick="changeWaitingName()">등록</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const versionTitle = document.getElementById("versionTitle");
    const lobbyOverlay = document.getElementById("lobbyOverlay");
    const waitingOverlay = document.getElementById("waitingOverlay");
    const waitingNoticeBanner = document.getElementById("waitingNoticeBanner");
    const stageBadge = document.getElementById("stageBadge");
    const nameInput = document.getElementById("nameInput");
    const waitingNameInput = document.getElementById("waitingNameInput");

    const WS_URL = "wss://arkanoid-3p-multi.onrender.com";
    let ws = null;
    let myRole = null;
    let myName = "플레이어" + Math.floor(Math.random() * 900 + 100);
    nameInput.value = myName;

    let bricks = [];
    let deadBrickIds = new Set();
    let ball = { x: 250, y: 350, radius: 8 };
    let paddles = { bottom: 250, left: 250, right: 250 };
    let playerNames = { bottom: "BOT", left: "BOT", right: "BOT" };
    let botSlots = ["bottom", "left", "right"];

    let lastTouchX = null;
    let lastTouchY = null;

    function connectSocket() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: "set_name", name: myName }));
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === "lobby_state") {
          versionTitle.innerText = `[ ${msg.title} ]`;
          updateLobbyUI(msg.slots);

          // 대기자 알림 배너 갱신
          if (msg.waiting_users && msg.waiting_users.length > 0 && myRole) {
            waitingNoticeBanner.style.display = "block";
            waitingNoticeBanner.innerText = `🔔 '${msg.waiting_users.join(", ")}' 님이 대기실에서 기다리고 있습니다!`;
          } else {
            waitingNoticeBanner.style.display = "none";
          }
        } 
        else if (msg.type === "waiting_room_notice") {
          // 3번째로 뒤늦게 접속한 유저를 위한 대기실 모드 가동
          lobbyOverlay.style.display = "none";
          waitingOverlay.style.display = "flex";
          stageBadge.style.display = "block";
          stageBadge.innerText = `STAGE ${msg.stage} / 3 (관전 대기 중)`;
          bricks = msg.bricks;
        } 
        else if (msg.type === "game_start") {
          if (myRole) {
            lobbyOverlay.style.display = "none";
            waitingOverlay.style.display = "none";
          }
          stageBadge.style.display = "block";
          bricks = msg.bricks;
          deadBrickIds.clear();
        } 
        else if (msg.type === "game_update") {
          ball = msg.ball;
          for (let r of ["bottom", "left", "right"]) {
            if (r !== myRole) {
              paddles[r] = msg.paddles[r];
            }
          }
          playerNames = msg.names || playerNames;
          botSlots = msg.bot_slots || [];
          stageBadge.innerText = `STAGE ${msg.stage} / 3`;
          msg.bricks.forEach(id => deadBrickIds.add(id));

          // 인게임 중 대기자 표시
          if (msg.waiting_users && msg.waiting_users.length > 0 && myRole) {
            waitingNoticeBanner.style.display = "block";
            waitingNoticeBanner.innerText = `🔔 '${msg.waiting_users.join(", ")}' 님이 대기실에서 대기 중!`;
          } else {
            waitingNoticeBanner.style.display = "none";
          }
          render();
        }
      };

      ws.onclose = () => {
        setTimeout(connectSocket, 3000);
      };
    }

    connectSocket();

    function changeName() {
      if (!nameInput.value.trim()) return;
      myName = nameInput.value.trim();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "set_name", name: myName }));
      }
    }

    function changeWaitingName() {
      if (!waitingNameInput.value.trim()) return;
      myName = waitingNameInput.value.trim();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "set_name", name: myName }));
      }
    }

    function selectRole(role) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      myRole = role;
      changeName();
      ws.send(JSON.stringify({ type: "select_role", role: role }));
    }

    function requestStart() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "start_game" }));
    }

    function updateLobbyUI(slots) {
      ["bottom", "left", "right"].forEach(r => {
        const btn = document.getElementById(`btn-${r}`);
        const label = document.getElementById(`label-${r}`);
        const slotData = slots[r];
        
        btn.classList.toggle("active", myRole === r);
        if (slotData.type === "USER") {
          label.innerText = (myRole === r ? "[나] " : "") + slotData.name;
          label.style.color = "#00ffcc";
        } else {
          label.innerText = "BOT (컴퓨터)";
          label.style.color = "#888";
        }
      });
    }

    // 상대 터치 드래그 (손가락 가림 방지)
    canvas.addEventListener("touchstart", (e) => {
      const touch = e.touches[0];
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (!myRole || !ws || ws.readyState !== WebSocket.OPEN || lastTouchX === null) return;

      const touch = e.touches[0];
      const deltaX = touch.clientX - lastTouchX;
      const deltaY = touch.clientY - lastTouchY;
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;

      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;

      if (myRole === "bottom") {
        paddles.bottom = Math.max(35, Math.min(465, paddles.bottom + deltaX * scale * 1.3));
        ws.send(JSON.stringify({ type: "move", pos: paddles.bottom }));
      } else if (myRole === "left") {
        paddles.left = Math.max(35, Math.min(465, paddles.left + deltaY * scale * 1.3));
        ws.send(JSON.stringify({ type: "move", pos: paddles.left }));
      } else if (myRole === "right") {
        paddles.right = Math.max(35, Math.min(465, paddles.right + deltaY * scale * 1.3));
        ws.send(JSON.stringify({ type: "move", pos: paddles.right }));
      }
    }, { passive: false });

    canvas.addEventListener("touchend", () => {
      lastTouchX = null;
      lastTouchY = null;
    });

    function drawCurvedPaddle(x, y, w, h, color, labelText) {
      ctx.fillStyle = color;
      ctx.beginPath();
      const r = Math.min(w, h) / 2;
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
      ctx.closePath();

      // 패들 옆 닉네임 라벨링
      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px sans-serif";
      if (w > h) {
        ctx.textAlign = "center";
        ctx.fillText(labelText, x + w / 2, y - 6);
      } else {
        ctx.textAlign = x < 50 ? "left" : "right";
        ctx.fillText(labelText, x < 50 ? x + 16 : x - 6, y + h / 2 + 4);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 상단 천장
      ctx.fillStyle = "#333";
      ctx.fillRect(0, 0, canvas.width, 10);

      // 벽돌
      bricks.forEach(b => {
        if (!deadBrickIds.has(b.id)) {
          ctx.fillStyle = "#2c5282";
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.strokeStyle = "#4299e1";
          ctx.strokeRect(b.x, b.y, b.w, b.h);
        }
      });

      // 패들 3종
      const isBotBottom = botSlots.includes("bottom");
      drawCurvedPaddle(paddles.bottom - 35, canvas.height - 20, 70, 10, isBotBottom ? "#555" : "#00ffcc", playerNames.bottom);

      const isBotLeft = botSlots.includes("left");
      drawCurvedPaddle(10, paddles.left - 35, 10, 70, isBotLeft ? "#555" : "#ff007f", playerNames.left);

      const isBotRight = botSlots.includes("right");
      drawCurvedPaddle(canvas.width - 20, paddles.right - 35, 10, 70, isBotRight ? "#555" : "#ffaa00", playerNames.right);

      // 공
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "#00d2ff";
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.closePath();
    }
  </script>
</body>
</html>
