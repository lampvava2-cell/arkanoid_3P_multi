<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3인 멀티 알카노이드 (빵패들 & 사운드)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0b0c12;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #versionTitle {
      font-size: 13px;
      color: #00ffcc;
      font-weight: bold;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    #scoreboard {
      display: flex;
      justify-content: space-around;
      width: min(92vw, 480px);
      background: #181b29;
      border: 1px solid #334;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: bold;
    }
    .score-item { display: flex; gap: 6px; }
    .score-item.bottom { color: #00ffcc; }
    .score-item.left { color: #ff007f; }
    .score-item.right { color: #ffaa00; }

    #waitingNoticeBanner {
      display: none;
      background: rgba(255, 170, 0, 0.25);
      border: 1px solid #ffaa00;
      color: #ffcc00;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; transform: scale(1.02); }
    }

    #container {
      position: relative;
      width: min(92vw, 480px);
      height: min(92vw, 480px);
      aspect-ratio: 1 / 1;
      border: 2px solid #334;
      box-shadow: 0 0 25px rgba(0,255,255,0.18);
      background: #141622;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      aspect-ratio: 1 / 1;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 12, 18, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 16px;
    }
    h2 { margin: 0 0 12px 0; color: #fff; font-size: 18px; }

    .name-box {
      display: flex;
      gap: 6px;
      width: 86%;
      margin-bottom: 12px;
    }
    .name-box input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #445;
      background: #1d2030;
      color: #fff;
      font-size: 13px;
      text-align: center;
    }
    .name-box button {
      padding: 0 14px;
      background: #3a7bd5;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      font-size: 12px;
    }

    .role-grid { display: flex; flex-direction: column; gap: 8px; width: 86%; margin-bottom: 14px; }
    .role-btn {
      padding: 11px 14px;
      border: 2px solid #3e445b;
      background: #1d2030;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      outline: none;
    }
    .role-btn.active { border-color: #00ffcc; background: #0f3636; color: #00ffcc; }
    #startBtn {
      width: 86%;
      padding: 13px;
      background: #00d2ff;
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #stageBadge {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 12px;
      color: #ffaa00;
      font-weight: bold;
      display: none;
      z-index: 5;
    }

    #countdownOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: 20;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #countdownNumber {
      font-size: 75px;
      font-weight: 900;
      color: #00ffcc;
      text-shadow: 0 0 20px #00ffcc;
      animation: pop 0.8s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1.0); }
    }

    #waitingOverlay { display: none; }
    .waiting-spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(0, 255, 204, 0.2);
      border-top-color: #00ffcc;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 16px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="versionTitle">스타트픽스_버전9.1 (Start Bug Fixed)</div>

  <!-- 스코어보드 -->
  <div id="scoreboard">
    <div class="score-item left" id="score-left">L(좌): 0</div>
    <div class="score-item bottom" id="score-bottom">B(하): 0</div>
    <div class="score-item right" id="score-right">R(우): 0</div>
  </div>

  <div id="waitingNoticeBanner">🔔 대기실에 참가자가 있습니다!</div>

  <div id="container">
    <div id="stageBadge">STAGE 1 / 3</div>
    <canvas id="game" width="500" height="500"></canvas>

    <!-- 카운트다운 레이어 -->
    <div id="countdownOverlay">
      <div id="countdownNumber">2</div>
    </div>

    <!-- 로비 -->
    <div id="lobbyOverlay" class="overlay">
      <h2>포지션 선택 및 참가</h2>
      <div class="name-box">
        <input type="text" id="nameInput" placeholder="닉네임 입력 (최대 6자)" maxlength="6">
        <button type="button" onclick="changeName()">확인</button>
      </div>
      <div class="role-grid">
        <button type="button" class="role-btn" id="btn-bottom" onclick="selectRole('bottom')">
          <span>하단 (가로)</span> <span id="label-bottom">BOT</span>
        </button>
        <button type="button" class="role-btn" id="btn-left" onclick="selectRole('left')">
          <span>좌측 (세로)</span> <span id="label-left">BOT</span>
        </button>
        <button type="button" class="role-btn" id="btn-right" onclick="selectRole('right')">
          <span>우측 (세로)</span> <span id="label-right">BOT</span>
        </button>
      </div>
      <button type="button" id="startBtn" onclick="requestStart()">GAME START</button>
    </div>

    <!-- 대기실 -->
    <div id="waitingOverlay" class="overlay">
      <div class="waiting-spinner"></div>
      <h2 style="color:#ffcc00; margin-bottom:8px;">게임이 진행 중입니다</h2>
      <p style="font-size:13px; color:#aaa; text-align:center; line-height:1.5; margin:0 0 16px 0;">
        현재 라운드가 진행 중입니다.<br>
        <strong>[대기실]</strong>에서 관전하며 대기해 주세요.<br>
        다음 라운드 시작 시 즉시 참여할 수 있습니다!
      </p>
      <div class="name-box" style="width:75%;">
        <input type="text" id="waitingNameInput" placeholder="내 닉네임 설정" maxlength="6">
        <button type="button" onclick="changeWaitingName()">등록</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const versionTitle = document.getElementById("versionTitle");
    const lobbyOverlay = document.getElementById("lobbyOverlay");
    const waitingOverlay = document.getElementById("waitingOverlay");
    const countdownOverlay = document.getElementById("countdownOverlay");
    const countdownNumber = document.getElementById("countdownNumber");
    const waitingNoticeBanner = document.getElementById("waitingNoticeBanner");
    const stageBadge = document.getElementById("stageBadge");
    const nameInput = document.getElementById("nameInput");
    const waitingNameInput = document.getElementById("waitingNameInput");

    const scoreLeft = document.getElementById("score-left");
    const scoreBottom = document.getElementById("score-bottom");
    const scoreRight = document.getElementById("score-right");

    // Audio Context
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === "brick") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === "paddle") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(480, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.1);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === "miss") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === "beep") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === "start") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(1000, now);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    const WS_URL = "wss://arkanoid-3p-multi.onrender.com";
    let ws = null;
    let myRole = null;
    let myName = "플레이어" + Math.floor(Math.random() * 900 + 100);
    nameInput.value = myName;

    let bricks = [];
    let deadBrickIds = new Set();
    let ball = { x: 250, y: 350, radius: 8 };
    let paddles = { bottom: 250, left: 250, right: 250 };
    let playerNames = { bottom: "BOT", left: "BOT", right: "BOT" };
    let botSlots = ["bottom", "left", "right"];

    let lastTouchX = null;
    let lastTouchY = null;

    function updateScoreboard(scores, names) {
      scoreBottom.innerText = `${names.bottom}: ${scores.bottom}`;
      scoreLeft.innerText = `${names.left}: ${scores.left}`;
      scoreRight.innerText = `${names.right}: ${scores.right}`;
    }

    function connectSocket() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: "set_name", name: myName }));
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === "lobby_state") {
          versionTitle.innerText = `[ ${msg.title} ]`;
          if (msg.names) playerNames = msg.names;
          updateLobbyUI(msg.slots);
          if (msg.scores) updateScoreboard(msg.scores, playerNames);

          if (msg.waiting_users && msg.waiting_users.length > 0 && myRole) {
            waitingNoticeBanner.style.display = "block";
            waitingNoticeBanner.innerText = `🔔 '${msg.waiting_users.join(", ")}' 님이 대기실 대기 중!`;
          } else {
            waitingNoticeBanner.style.display = "none";
          }
        }
        else if (msg.type === "waiting_room_notice") {
          lobbyOverlay.style.display = "none";
          waitingOverlay.style.display = "flex";
          stageBadge.style.display = "block";
          stageBadge.innerText = `STAGE ${msg.stage} / 3 (관전 대기 중)`;
          if (msg.names) playerNames = msg.names;
          bricks = msg.bricks;
        }
        else if (msg.type === "countdown") {
          lobbyOverlay.style.display = "none";
          waitingOverlay.style.display = "none";
          countdownOverlay.style.display = "flex";
          countdownNumber.innerText = msg.count;
          playSound("beep");
          if (msg.names) playerNames = msg.names;
          bricks = msg.bricks;
          deadBrickIds.clear();
        }
        else if (msg.type === "game_start") {
          countdownNumber.innerText = "START!";
          playSound("start");
          setTimeout(() => {
            countdownOverlay.style.display = "none";
          }, 500);

          stageBadge.style.display = "block";
          if (msg.names) playerNames = msg.names;
          bricks = msg.bricks;
          deadBrickIds.clear();
        }
        else if (msg.type === "game_update") {
          ball = msg.ball;
          for (let r of ["bottom", "left", "right"]) {
            if (r !== myRole) {
              paddles[r] = msg.paddles[r];
            }
          }
          if (msg.names) playerNames = msg.names;
          botSlots = msg.bot_slots || [];
          stageBadge.innerText = `STAGE ${msg.stage} / 3`;
          msg.bricks.forEach(id => deadBrickIds.add(id));

          if (msg.sound) playSound(msg.sound);
          if (msg.scores) updateScoreboard(msg.scores, playerNames);

          if (msg.waiting_users && msg.waiting_users.length > 0 && myRole) {
            waitingNoticeBanner.style.display = "block";
            waitingNoticeBanner.innerText = `🔔 '${msg.waiting_users.join(", ")}' 님이 대기실 대기 중!`;
          } else {
            waitingNoticeBanner.style.display = "none";
          }
          render();
        }
      };

      ws.onclose = () => {
        setTimeout(connectSocket, 3000);
      };
    }

    connectSocket();

    function changeName() {
      initAudio();
      if (!nameInput.value.trim()) return;
      myName = nameInput.value.trim();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "set_name", name: myName }));
      }
    }

    function changeWaitingName() {
      initAudio();
      if (!waitingNameInput.value.trim()) return;
      myName = waitingNameInput.value.trim();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "set_name", name: myName }));
      }
    }

    function selectRole(role) {
      initAudio();
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      myRole = role;
      changeName();
      ws.send(JSON.stringify({ type: "select_role", role: role }));
    }

    function requestStart() {
      initAudio();
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert("서버 연결 중입니다. 잠시 후 다시 눌러주세요.");
        return;
      }
      // 이름 즉시 전송
      changeName();

      // 포지션을 아직 안 골랐다면 자동으로 'bottom(하단)' 배정
      if (!myRole) {
        selectRole('bottom');
      }

      // 서버로 게임 스타트 요청
      ws.send(JSON.stringify({ type: "start_game" }));
    }

    function updateLobbyUI(slots) {
      ["bottom", "left", "right"].forEach(r => {
        const btn = document.getElementById(`btn-${r}`);
        const label = document.getElementById(`label-${r}`);
        const slotData = slots[r];

        btn.classList.toggle("active", myRole === r);
        if (slotData.type === "USER") {
          label.innerText = (myRole === r ? "[나] " : "") + slotData.name;
          label.style.color = "#00ffcc";
        } else {
          label.innerText = "BOT (컴퓨터)";
          label.style.color = "#888";
        }
      });
    }

    canvas.addEventListener("touchstart", (e) => {
      initAudio();
      const touch = e.touches[0];
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (!myRole || !ws || ws.readyState !== WebSocket.OPEN || lastTouchX === null) return;

      const touch = e.touches[0];
      const deltaX = touch.clientX - lastTouchX;
      const deltaY = touch.clientY - lastTouchY;
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;

      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;

      if (myRole === "bottom") {
        paddles.bottom = Math.max(35, Math.min(465, paddles.bottom + deltaX * scale * 1.3));
        ws.send(JSON.stringify({ type: "move", pos: paddles.bottom }));
      } else if (myRole === "left") {
        paddles.left = Math.max(35, Math.min(465, paddles.left + deltaY * scale * 1.3));
        ws.send(JSON.stringify({ type: "move", pos: paddles.left }));
      } else if (myRole === "right") {
        paddles.right = Math.max(35, Math.min(465, paddles.right + deltaY * scale * 1.3));
        ws.send(JSON.stringify({ type: "move", pos: paddles.right }));
      }
    }, { passive: false });

    canvas.addEventListener("touchend", () => {
      lastTouchX = null;
      lastTouchY = null;
    });

    function drawPuffyPaddle(pos, role, color, name) {
      ctx.save();
      const pLen = 70;
      const pThick = 14;

      if (role === "bottom") {
        const cx = pos;
        const cy = canvas.height - 16;
        const grad = ctx.createRadialGradient(cx, cy - 4, 2, cx, cy, pLen / 2);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.3, color);
        grad.addColorStop(1, "#0f172a");

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(cx - pLen / 2, cy + 6);
        ctx.bezierCurveTo(cx - pLen / 2, cy - pThick, cx + pLen / 2, cy - pThick, cx + pLen / 2, cy + 6);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(name, cx, cy - pThick - 4);

      } else if (role === "left") {
        const cx = 16;
        const cy = pos;
        const grad = ctx.createRadialGradient(cx + 4, cy, 2, cx, cy, pLen / 2);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.3, color);
        grad.addColorStop(1, "#0f172a");

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(cx - 6, cy - pLen / 2);
        ctx.bezierCurveTo(cx + pThick, cy - pLen / 2, cx + pThick, cy + pLen / 2, cx - 6, cy + pLen / 2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(name, cx + pThick + 6, cy + 4);

      } else if (role === "right") {
        const cx = canvas.width - 16;
        const cy = pos;
        const grad = ctx.createRadialGradient(cx - 4, cy, 2, cx, cy, pLen / 2);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.3, color);
        grad.addColorStop(1, "#0f172a");

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(cx + 6, cy - pLen / 2);
        ctx.bezierCurveTo(cx - pThick, cy - pLen / 2, cx - pThick, cy + pLen / 2, cx + 6, cy + pLen / 2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(name, cx - pThick - 6, cy + 4);
      }
      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#333";
      ctx.fillRect(0, 0, canvas.width, 10);

      bricks.forEach(b => {
        if (!deadBrickIds.has(b.id)) {
          ctx.fillStyle = "#2c5282";
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.strokeStyle = "#4299e1";
          ctx.strokeRect(b.x, b.y, b.w, b.h);
        }
      });

      const isBotBottom = botSlots.includes("bottom");
      drawPuffyPaddle(paddles.bottom, "bottom", isBotBottom ? "#64748b" : "#00ffcc", playerNames.bottom);

      const isBotLeft = botSlots.includes("left");
      drawPuffyPaddle(paddles.left, "left", isBotLeft ? "#64748b" : "#ff007f", playerNames.left);

      const isBotRight = botSlots.includes("right");
      drawPuffyPaddle(paddles.right, "right", isBotRight ? "#64748b" : "#ffaa00", playerNames.right);

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "#00d2ff";
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.closePath();
    }
  </script>
</body>
</html>
