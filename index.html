<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3인 멀티 알카노이드 (정사각형)</title>
  <style>
    body {
      margin: 0;
      background: #0d0e15;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #versionTitle {
      font-size: 13px;
      color: #00ffcc;
      font-weight: bold;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    /* 모바일 화면 너비에 맞춘 완벽한 정사각형 컨테이너 */
    #container {
      position: relative;
      width: 92vw;
      height: 92vw;
      max-width: 500px;
      max-height: 500px;
      border: 2px solid #333;
      box-shadow: 0 0 25px rgba(0,255,255,0.15);
      background: #151722;
      border-radius: 12px;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    
    #lobbyOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 14, 21, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    h2 { margin: 0 0 14px 0; color: #fff; font-size: 18px; }
    #connectionInfo {
      font-size: 12px;
      color: #ffaa00;
      margin-bottom: 12px;
      text-align: center;
    }
    .role-grid { display: flex; flex-direction: column; gap: 8px; width: 84%; margin-bottom: 16px; }
    .role-btn {
      padding: 12px;
      border: 2px solid #444;
      background: #202433;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      outline: none;
    }
    .role-btn.active { border-color: #00ffcc; background: #123838; color: #00ffcc; }
    #startBtn {
      width: 84%;
      padding: 13px;
      background: #00d2ff;
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    #stageBadge {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 12px;
      color: #ffaa00;
      font-weight: bold;
      display: none;
    }
    #guideTip {
      margin-top: 10px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="versionTitle">정사각형_상대터치버전5 (Square & Relative Touch)</div>
  
  <div id="container">
    <div id="stageBadge">STAGE 1 / 3</div>
    <canvas id="game" width="500" height="500"></canvas>

    <div id="lobbyOverlay">
      <h2>포지션 선택</h2>
      <div id="connectionInfo">서버 신호 연결 대기 중...</div>
      <div class="role-grid">
        <button class="role-btn" id="btn-bottom" onclick="selectRole('bottom')">
          <span>하단 (가로 제어)</span> <span id="label-bottom">BOT</span>
        </button>
        <button class="role-btn" id="btn-left" onclick="selectRole('left')">
          <span>좌측 (세로 제어)</span> <span id="label-left">BOT</span>
        </button>
        <button class="role-btn" id="btn-right" onclick="selectRole('right')">
          <span>우측 (세로 제어)</span> <span id="label-right">BOT</span>
        </button>
      </div>
      <button id="startBtn" onclick="requestStart()">GAME START</button>
      <div id="guideTip">※ 화면 아무 곳이나 드래그해도 패들이 움직입니다 (손가락 가림 방지)</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const versionTitle = document.getElementById("versionTitle");
    const lobbyOverlay = document.getElementById("lobbyOverlay");
    const stageBadge = document.getElementById("stageBadge");
    const connInfo = document.getElementById("connectionInfo");

    const WS_URL = "wss://arkanoid-3p-multi.onrender.com";
    let ws = null;
    let myRole = null;
    let bricks = [];
    let deadBrickIds = new Set();
    let ball = { x: 250, y: 350, radius: 8 };
    let paddles = { bottom: 250, left: 250, right: 250 };
    let botSlots = ["bottom", "left", "right"];

    // 상대 드래그 터치 처리를 위한 마지막 터치 좌표 저장
    let lastTouchX = null;
    let lastTouchY = null;

    function connectSocket() {
      connInfo.innerText = "서버 연결 시도 중...";
      connInfo.style.color = "#ffaa00";

      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        connInfo.innerText = "서버 연결 완료! 자리를 선택하세요.";
        connInfo.style.color = "#00ffcc";
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === "lobby_state") {
          versionTitle.innerText = `[ ${msg.title} ]`;
          updateLobbyUI(msg.slots);
        } else if (msg.type === "game_start") {
          lobbyOverlay.style.display = "none";
          stageBadge.style.display = "block";
          bricks = msg.bricks;
          deadBrickIds.clear();
        } else if (msg.type === "game_update") {
          ball = msg.ball;
          // 내 패들은 부드러운 로컬 조작을 위해 서버 덮어쓰기 대신 다른 플레이어만 갱신
          for (let r of ["bottom", "left", "right"]) {
            if (r !== myRole) {
              paddles[r] = msg.paddles[r];
            }
          }
          botSlots = msg.bot_slots || [];
          stageBadge.innerText = `STAGE ${msg.stage} / 3`;
          msg.bricks.forEach(id => deadBrickIds.add(id));
          render();
        }
      };

      ws.onclose = () => {
        connInfo.innerText = "서버 연결 끊김. 3초 후 재접속 시도...";
        connInfo.style.color = "#ff4444";
        setTimeout(connectSocket, 3000);
      };

      ws.onerror = () => {
        connInfo.innerText = "서버 연결 대기 중...";
      };
    }

    connectSocket();

    function selectRole(role) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      myRole = role;
      ws.send(JSON.stringify({ type: "select_role", role: role }));
    }

    function requestStart() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "start_game" }));
    }

    function updateLobbyUI(slots) {
      ["bottom", "left", "right"].forEach(r => {
        const btn = document.getElementById(`btn-${r}`);
        const label = document.getElementById(`label-${r}`);
        const isUser = slots[r] === "USER";
        
        btn.classList.toggle("active", myRole === r);
        label.innerText = isUser ? (myRole === r ? "YOU" : "READY") : "BOT";
        label.style.color = isUser ? "#00ffcc" : "#888";
      });
    }

    // [손가락 가림 방지] 상대적 드래그(Relative Drag) 터치 핸들러
    canvas.addEventListener("touchstart", (e) => {
      const touch = e.touches[0];
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (!myRole || !ws || ws.readyState !== WebSocket.OPEN || lastTouchX === null) return;

      const touch = e.touches[0];
      const deltaX = touch.clientX - lastTouchX;
      const deltaY = touch.clientY - lastTouchY;
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;

      // 캔버스 크기 대비 비율 계산
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / rect.width;

      if (myRole === "bottom") {
        paddles.bottom = Math.max(35, Math.min(465, paddles.bottom + deltaX * scale * 1.3));
        ws.send(JSON.stringify({ type: "move", pos: paddles.bottom }));
      } else if (myRole === "left") {
        paddles.left = Math.max(35, Math.min(465, paddles.left + deltaY * scale * 1.3));
        ws.send(JSON.stringify({ type: "move", pos: paddles.left }));
      } else if (myRole === "right") {
        paddles.right = Math.max(35, Math.min(465, paddles.right + deltaY * scale * 1.3));
        ws.send(JSON.stringify({ type: "move", pos: paddles.right }));
      }
    }, { passive: false });

    canvas.addEventListener("touchend", () => {
      lastTouchX = null;
      lastTouchY = null;
    });

    function drawCurvedPaddle(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      const r = Math.min(w, h) / 2;
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
      ctx.closePath();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 상단 가이드 벽
      ctx.fillStyle = "#333";
      ctx.fillRect(0, 0, canvas.width, 10);

      // 벽돌
      bricks.forEach(b => {
        if (!deadBrickIds.has(b.id)) {
          ctx.fillStyle = "#2c5282";
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.strokeStyle = "#4299e1";
          ctx.strokeRect(b.x, b.y, b.w, b.h);
        }
      });

      // 패들 3종 (길이 70 균일)
      const isBotBottom = botSlots.includes("bottom");
      drawCurvedPaddle(paddles.bottom - 35, canvas.height - 20, 70, 10, isBotBottom ? "#555" : "#00ffcc");

      const isBotLeft = botSlots.includes("left");
      drawCurvedPaddle(10, paddles.left - 35, 10, 70, isBotLeft ? "#555" : "#ff007f");

      const isBotRight = botSlots.includes("right");
      drawCurvedPaddle(canvas.width - 20, paddles.right - 35, 10, 70, isBotRight ? "#555" : "#ffaa00");

      // 공
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "#00d2ff";
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.closePath();
    }
  </script>
</body>
</html>
