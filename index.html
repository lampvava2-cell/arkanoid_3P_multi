<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3인 멀티 알카노이드</title>
  <style>
    body {
      margin: 0;
      background: #0d0e15;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #versionTitle {
      font-size: 13px;
      color: #00ffcc;
      font-weight: bold;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    #container {
      position: relative;
      width: 380px;
      height: 580px;
      border: 2px solid #333;
      box-shadow: 0 0 20px rgba(0,255,255,0.15);
      background: #151722;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    
    #lobbyOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 14, 21, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    h2 { margin: 0 0 16px 0; color: #fff; font-size: 19px; }
    #connectionInfo {
      font-size: 12px;
      color: #ffaa00;
      margin-bottom: 12px;
      text-align: center;
    }
    .role-grid { display: flex; flex-direction: column; gap: 10px; width: 82%; margin-bottom: 20px; }
    .role-btn {
      padding: 13px;
      border: 2px solid #444;
      background: #202433;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      outline: none;
    }
    .role-btn.active { border-color: #00ffcc; background: #123838; color: #00ffcc; }
    #startBtn {
      width: 82%;
      padding: 14px;
      background: #00d2ff;
      border: none;
      border-radius: 8px;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #stageBadge {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 12px;
      color: #ffaa00;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>
  <div id="versionTitle">무한핑퐁방지버전4 (Curved Paddle & Anti-Stall)</div>
  
  <div id="container">
    <div id="stageBadge">STAGE 1 / 3</div>
    <canvas id="game" width="400" height="600"></canvas>

    <div id="lobbyOverlay">
      <h2>플레이어 위치 지정</h2>
      <div id="connectionInfo">서버 신호 연결 대기 중...</div>
      <div class="role-grid">
        <button class="role-btn" id="btn-bottom" onclick="selectRole('bottom')">
          <span>하단 (BOTTOM)</span> <span id="label-bottom">BOT</span>
        </button>
        <button class="role-btn" id="btn-left" onclick="selectRole('left')">
          <span>좌측 (LEFT)</span> <span id="label-left">BOT</span>
        </button>
        <button class="role-btn" id="btn-right" onclick="selectRole('right')">
          <span>우측 (RIGHT)</span> <span id="label-right">BOT</span>
        </button>
      </div>
      <button id="startBtn" onclick="requestStart()">GAME START</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const versionTitle = document.getElementById("versionTitle");
    const lobbyOverlay = document.getElementById("lobbyOverlay");
    const stageBadge = document.getElementById("stageBadge");
    const connInfo = document.getElementById("connectionInfo");

    const WS_URL = "wss://arkanoid-3p-multi.onrender.com";
    let ws = null;
    let myRole = null;
    let bricks = [];
    let deadBrickIds = new Set();
    let ball = { x: 200, y: 380, radius: 8 };
    let paddles = { bottom: 200, left: 300, right: 300 };
    let botSlots = ["bottom", "left", "right"];

    function connectSocket() {
      connInfo.innerText = "서버 연결 시도 중...";
      connInfo.style.color = "#ffaa00";

      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        connInfo.innerText = "서버 연결 완료! 자리를 선택하세요.";
        connInfo.style.color = "#00ffcc";
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === "lobby_state") {
          versionTitle.innerText = `[ ${msg.title} ]`;
          updateLobbyUI(msg.slots);
        } else if (msg.type === "game_start") {
          lobbyOverlay.style.display = "none";
          stageBadge.style.display = "block";
          bricks = msg.bricks;
          deadBrickIds.clear();
        } else if (msg.type === "game_update") {
          ball = msg.ball;
          paddles = msg.paddles;
          botSlots = msg.bot_slots || [];
          stageBadge.innerText = `STAGE ${msg.stage} / 3`;
          msg.bricks.forEach(id => deadBrickIds.add(id));
          render();
        }
      };

      ws.onclose = () => {
        connInfo.innerText = "서버와 연결 끊김. 3초 후 재접속 시도...";
        connInfo.style.color = "#ff4444";
        setTimeout(connectSocket, 3000);
      };

      ws.onerror = () => {
        connInfo.innerText = "서버 연결 대기 중...";
      };
    }

    connectSocket();

    function selectRole(role) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      myRole = role;
      ws.send(JSON.stringify({ type: "select_role", role: role }));
    }

    function requestStart() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "start_game" }));
    }

    function updateLobbyUI(slots) {
      ["bottom", "left", "right"].forEach(r => {
        const btn = document.getElementById(`btn-${r}`);
        const label = document.getElementById(`label-${r}`);
        const isUser = slots[r] === "USER";
        
        btn.classList.toggle("active", myRole === r);
        label.innerText = isUser ? (myRole === r ? "YOU" : "READY") : "BOT";
        label.style.color = isUser ? "#00ffcc" : "#888";
      });
    }

    function handleTouch(e) {
      if (!myRole || !ws || ws.readyState !== WebSocket.OPEN) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const touch = e.touches[0];
      const touchX = (touch.clientX - rect.left) * scaleX;
      const touchY = (touch.clientY - rect.top) * scaleY;

      let pos = 0;
      if (myRole === "bottom") {
        pos = Math.max(35, Math.min(365, touchX));
      } else {
        pos = Math.max(35, Math.min(565, touchY));
      }

      ws.send(JSON.stringify({ type: "move", pos: pos }));
    }

    canvas.addEventListener("touchmove", handleTouch, { passive: false });
    canvas.addEventListener("touchstart", handleTouch, { passive: false });

    // 둥근 캡슐형(볼록) 패들 렌더링 헬퍼 함수
    function drawCurvedPaddle(x, y, w, h, color, isVertical) {
      ctx.fillStyle = color;
      ctx.beginPath();
      const r = Math.min(w, h) / 2;
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
      ctx.closePath();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 상단 가이드 벽
      ctx.fillStyle = "#333";
      ctx.fillRect(0, 0, canvas.width, 10);

      // 벽돌
      bricks.forEach(b => {
        if (!deadBrickIds.has(b.id)) {
          ctx.fillStyle = "#2c5282";
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.strokeStyle = "#4299e1";
          ctx.strokeRect(b.x, b.y, b.w, b.h);
        }
      });

      // 둥근 볼록 패들 3종
      const isBotBottom = botSlots.includes("bottom");
      drawCurvedPaddle(paddles.bottom - 32.5, canvas.height - 20, 65, 10, isBotBottom ? "#555" : "#00ffcc", false);

      const isBotLeft = botSlots.includes("left");
      drawCurvedPaddle(10, paddles.left - 32.5, 10, 65, isBotLeft ? "#555" : "#ff007f", true);

      const isBotRight = botSlots.includes("right");
      drawCurvedPaddle(canvas.width - 20, paddles.right - 32.5, 10, 65, isBotRight ? "#555" : "#ffaa00", true);

      // 공
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "#00d2ff";
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.closePath();
    }
  </script>
</body>
</html>
